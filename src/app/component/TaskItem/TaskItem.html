<div class="task-item-container">
  <input
    type="checkbox"
    [checked]="task.done"
    [disabled]="disabled"
    (change)="toggle.emit(task.id)"
  />
  <span [class.done]="task.done" (click)="taskSelected.emit(task.id)">{{ task.title }}</span>
  <time>{{ task.createdAt | timeAgo }}</time>
</div>
