<div class="task-item-container">
  <p-checkbox
    [ngModel]="task.done"
    [binary]="true"
    [disabled]="disabled"
    (onChange)="toggle.emit(task.id)"
    [ariaLabel]="'Mark ' + task.title + (task.done ? ' as in progress' : ' as complete')"
  />
  <button type="button" class="task-title" [class.done]="task.done" (click)="taskSelected.emit(task.id)">
    {{ task.title }}
  </button>
  <div class="task-meta">
    <time>{{ task.createdAt | timeAgo }}</time>
    <p-tag [value]="task.done ? 'Completed' : 'In progress'" [severity]="task.done ? 'success' : 'info'" />
  </div>
</div>
