<div class="form-container">
  <h2>Add New Task</h2>
  <form (ngSubmit)="submit()">
    <div class="form-grid">
      <label for="task-title">
        Task title
        <input 
          id="task-title"
          type="text"
          name="title"
          [(ngModel)]="title"
          required
          [disabled]="disabled"
        />
      </label>
    
    </div>
    <div class="form-actions">
      <button type="submit" class="btn primary" [disabled]="!title.trim() || disabled">Save</button>
      <button type="button" class="btn secondary" (click)="onCancel()" [disabled]="disabled">Cancel</button>
    </div>
    
  </form>
</div>
