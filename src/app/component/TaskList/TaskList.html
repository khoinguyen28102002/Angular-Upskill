<div class="list-container">
  <ul>
    @for (task of tasks; track task.id) {
      <li class="task-item">
        <app-task-item
          [task]="task"
          [disabled]="disabled"
          (toggle)="onToggle($event)"
          (taskSelected)="onClick($event)"
        ></app-task-item>
      </li>
    }
  </ul>
</div>
