<main class="page">
  <header class="page-header">
    <div>
      <h1>Task Management</h1>
    </div>
    <button type="button" class="btn primary" (click)="showCreateForm()">Add Task</button>
  </header>

  @if(isFormVisible){
    <app-task-form
      (create)="createTask($event)"
      (cancel)="cancelForm()"
    ></app-task-form>
  }

  <app-task-list
    [tasks]="tasks"
    (toggle)="toggleTask($event)"
  ></app-task-list>
</main>
